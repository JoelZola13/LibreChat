name: Docker Images Build on Tag

on:
  push:
    tags:
      - '*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      HAS_DOCKERHUB_SECRETS: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
    strategy:
      matrix:
        include:
          - target: api-build
            file: Dockerfile.multi
            image_name: librechat-api
          - target: node
            file: Dockerfile
            image_name: librechat

    steps:
      # Check out the repository
      - name: Checkout
        uses: actions/checkout@v6.0.2

      # Set up QEMU
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.1.0

      # Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.0.0

      # Log in to GitHub Container Registry
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize GHCR owner
        id: ghcr-owner
        run: echo "owner=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      # Login to Docker Hub
      - name: Login to Docker Hub
        if: ${{ env.HAS_DOCKERHUB_SECRETS == 'true' }}
        uses: docker/login-action@v4.1.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Skip Docker Hub login
        if: ${{ env.HAS_DOCKERHUB_SECRETS != 'true' }}
        run: echo "Skipping Docker Hub login and tags because DOCKERHUB_USERNAME or DOCKERHUB_TOKEN is not configured."

      # Prepare the environment
      - name: Prepare environment
        run: |
          cp .env.example .env

      # Build and push Docker images for each target
      - name: Build and push Docker images
        if: ${{ env.HAS_DOCKERHUB_SECRETS == 'true' }}
        uses: docker/build-push-action@v7.1.0
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          tags: |
            ghcr.io/${{ steps.ghcr-owner.outputs.owner }}/${{ matrix.image_name }}:${{ github.ref_name }}
            ghcr.io/${{ steps.ghcr-owner.outputs.owner }}/${{ matrix.image_name }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image_name }}:${{ github.ref_name }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image_name }}:latest
          platforms: linux/amd64,linux/arm64
          target: ${{ matrix.target }}

      - name: Build and push Docker images to GHCR
        if: ${{ env.HAS_DOCKERHUB_SECRETS != 'true' }}
        uses: docker/build-push-action@v7.1.0
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          tags: |
            ghcr.io/${{ steps.ghcr-owner.outputs.owner }}/${{ matrix.image_name }}:${{ github.ref_name }}
            ghcr.io/${{ steps.ghcr-owner.outputs.owner }}/${{ matrix.image_name }}:latest
          platforms: linux/amd64,linux/arm64
          target: ${{ matrix.target }}
